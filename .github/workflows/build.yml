name: Build Images

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main, 'release/**']

# A push to main pushes :latest only. A version tag (:vX.Y.Z) is pushed only
# on a tag event: a published version tag never moves, so a rebuild from main
# must not re-push it with a new digest. On a push to main the versioned
# tag line is empty, and build-push-action drops empty lines.
env:
  REGISTRY: ghcr.io
  C4_VERSION: "v1.0.26"

jobs:
  build-c4:
    name: Build c4 minimal
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push c4
        uses: docker/build-push-action@v5
        with:
          context: c4
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/avalanche-io/c4:latest
            ${{ github.ref_type == 'tag' && format('{0}/avalanche-io/c4:{1}', env.REGISTRY, env.C4_VERSION) || '' }}
          build-args: |
            C4_VERSION=${{ env.C4_VERSION }}
          platforms: linux/amd64,linux/arm64

  build-pipeline:
    name: Build c4-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push c4-pipeline
        uses: docker/build-push-action@v5
        with:
          context: c4-pipeline
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/avalanche-io/c4-pipeline:latest
            ${{ github.ref_type == 'tag' && format('{0}/avalanche-io/c4-pipeline:{1}', env.REGISTRY, env.C4_VERSION) || '' }}
          build-args: |
            C4_VERSION=${{ env.C4_VERSION }}

  build-s3worker:
    name: Build c4-s3worker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push c4-s3worker
        uses: docker/build-push-action@v5
        with:
          context: c4-s3worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/avalanche-io/c4-s3worker:latest
            ${{ github.ref_type == 'tag' && format('{0}/avalanche-io/c4-s3worker:{1}', env.REGISTRY, env.C4_VERSION) || '' }}
          build-args: |
            C4_VERSION=${{ env.C4_VERSION }}
